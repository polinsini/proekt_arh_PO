version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: practice01-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: >
      redis-server
      --requirepass mypassword
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mypassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: practice01-redis-commander
    restart: unless-stopped

    environment:
      - REDIS_HOSTS=local:redis:6379:0:mypassword

    ports:
      - "8081:8081"

    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local