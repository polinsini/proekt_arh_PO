version: "3.9"

services:
  #  Сервис 1: PostgreSQL-сервер 
  postgres:
    image: postgres:16-alpine
    container_name: practice01-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: practice_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Скрипты инициализации можно подключить позже:
    # - ./init-scripts:/docker-entrypoint-initdb.d

    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c log_statement=all
      -c log_destination=stderr

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d practice_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  Сервис 2: pgAdmin 4 (веб-интерфейс) 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: practice01-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"

    ports:
      - "8083:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

  pgadmin_data:
    driver: local